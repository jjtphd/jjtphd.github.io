meta:
  name: Joshua J. Taylor
  link: https://jjtphd.github.io

color:
  palette:
    gunmetal: "#293241"
    blue: "#3D5A80"
    cerulean: "#98C1D9"
    lightcyan: "#E0FBFC"
    sienna: "#EE6C4D"
  foreground: gunmetal
  background: lightcyan
  primary: blue
  secondary: cerulean
  link: blue

typography:
  fonts:
    - family: Atkinson Hyperlegible
      source: google
    - family: Source Code Pro
      source: google
  base:
    family: Atkinson Hyperlegible
    size: 17px
    line-height: 1.6
  headings:
    family: Atkinson Hyperlegible
    weight: 700
    color: gunmetal
  monospace:
    family: Source Code Pro
  link:
    color: blue
    decoration: underline
